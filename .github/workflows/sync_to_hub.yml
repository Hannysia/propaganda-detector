name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Inject YAML Front Matter & Cleanup
        run: |
          printf -- "---\n" > hf_header.txt
          printf "title: Propaganda Detector\n" >> hf_header.txt
          printf "emoji: 📢\n" >> hf_header.txt
          printf "colorFrom: red\n" >> hf_header.txt
          printf "colorTo: gray\n" >> hf_header.txt
          printf "sdk: streamlit\n" >> hf_header.txt
          printf "app_file: deployment/app.py\n" >> hf_header.txt
          printf "app_port: 8501\n" >> hf_header.txt
          printf "tags:\n  - nlp\n  - propaganda-detection\n  - transformers\n" >> hf_header.txt
          printf "pinned: false\n" >> hf_header.txt
          printf "short_description: Detect propaganda techniques using Stacking Ensemble (Transformers)\n" >> hf_header.txt
          printf "license: mit\n" >> hf_header.txt
          printf -- "---\n\n" >> hf_header.txt

          cat hf_header.txt README.md > README_temp.md
          mv README_temp.md README.md
          
          sed -i 's|deployment/screenshots/|https://raw.githubusercontent.com/Hannysia/propaganda-detector/main/deployment/screenshots/|g' README.md
          
          rm -rf deployment/screenshots

          rm -rf .github
          rm hf_header.txt

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          git add .
          git commit -m "Deploy: Inject metadata and fix image links for HF"

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: hannusia123123
          HF_SPACE_NAME: propaganda-detector
        run: |
          git remote add space https://hannusia123123:$HF_TOKEN@huggingface.co/spaces/hannusia123123/propaganda-detector
          git push --force space main