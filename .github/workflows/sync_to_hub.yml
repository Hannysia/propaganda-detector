name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Inject YAML Front Matter & Cleanup
        run: |
          cat <<EOF > hf_header.txt
          ---
          title: Propaganda Detector
          emoji: 📢
          colorFrom: red
          colorTo: gray
          sdk: streamlit
          app_file: deployment/app.py
          app_port: 8501
          tags:
            - nlp
            - propaganda-detection
            - transformers
          pinned: false
          short_description: Detect propaganda techniques using Stacking Ensemble (Transformers)
          license: mit
          ---
          
          EOF
          
          cat hf_header.txt README.md > README_temp.md
          mv README_temp.md README.md
          
          rm -rf .github
          rm hf_header.txt

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          git add .
          git commit -m "Deploy: Inject metadata and cleanup for Hugging Face"

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: hannusia123123
          HF_SPACE_NAME: propaganda-detector
        run: |
          git remote add space https://hannusia123123:$HF_TOKEN@huggingface.co/spaces/hannusia123123/propaganda-detector
          
          git push --force space main